<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | POLIMOTOS</title>
  <link rel="icon" type="image/png" href="assets/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'A4 SPEED';
      src: url('assets/fonts/A4SPEED-Bold.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #070707;
      --red: #ed1c24;
      --text: #f5f5f5;
      --muted: #a7a7ab;
      --panel: #111113;
      --line: rgba(255,255,255,.09);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'TT Commons Classic', 'TT Commons', Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .badge {
      font-family: 'A4 SPEED', sans-serif;
      color: var(--red);
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }
    h1 {
      font-family: 'A4 SPEED', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    p {
      font-family: 'Roboto', sans-serif;
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 999px;
      box-shadow: 0 14px 35px rgba(237,28,36,.25);
      transition: .2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: #ff242d;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">404</div>
    <h1>Página não encontrada</h1>
    <p>O link que você tentou acessar não existe ou foi movido. Retorne para a página principal da POLIMOTOS.</p>
    <a href="/" class="btn">Voltar para o Início</a>
  </div>
</body>
</html>
